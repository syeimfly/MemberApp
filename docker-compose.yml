services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memberapp
      POSTGRES_PASSWORD: memberapp
      POSTGRES_DB: memberapp
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memberapp -d memberapp"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://memberapp:memberapp@db:5432/memberapp
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host --port 5174

volumes:
  pgdata:
